name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Tag builds take their version from the tag (v1.2.3 -> 1.2.3) and must match the csproj.
      # Other builds use the version in the csproj.
      - name: Version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/VanguardSwitch.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { Write-Error "Tag v$tag doesn't match <Version>$v</Version> in the csproj"; exit 1 }
          }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build src/VanguardSwitch.csproj -c Release -o out -p:Version=${{ env.VERSION }}

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash out/VanguardSwitch.exe -Algorithm SHA256).Hash.ToLower()
          "$h  VanguardSwitch.exe" | Out-File out/VanguardSwitch.exe.sha256 -Encoding ascii
          "SHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: VanguardSwitch
          path: |
            out/VanguardSwitch.exe
            out/VanguardSwitch.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job can create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VanguardSwitch

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            VanguardSwitch.exe
            VanguardSwitch.exe.sha256
          generate_release_notes: true
