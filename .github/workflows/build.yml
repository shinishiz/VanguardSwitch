name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Tag builds take their version from the tag (v1.2.3 -> 1.2.3) and must match the csproj.
      # Other builds use the version in the csproj.
      - name: Version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/VanguardSwitch.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $v) { Write-Error "Tag v$tag doesn't match <Version>$v</Version> in the csproj"; exit 1 }
          }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build src/VanguardSwitch.csproj -c Release -o out -p:Version=${{ env.VERSION }}

      # mocks only: the updater's refusals and the window's states, nothing touches Vanguard
      - name: Simulated tests
        shell: pwsh
        run: |
          dotnet build tests/Simulated/Simulated.csproj -c Release -o tests/Simulated/bin/out
          tests/Simulated/bin/out/Simulated.exe "$env:RUNNER_TEMP/simulated"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulated-screenshots
          path: ${{ runner.temp }}/simulated/*.png
          if-no-files-found: ignore

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash out/VanguardSwitch.exe -Algorithm SHA256).Hash.ToLower()
          "$h  VanguardSwitch.exe" | Out-File out/VanguardSwitch.exe.sha256 -Encoding ascii
          "SHA-256: ``$h``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: VanguardSwitch
          path: |
            out/VanguardSwitch.exe
            out/VanguardSwitch.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job can create the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: VanguardSwitch
          path: out

      # release text = this tag's section of CHANGELOG.md
      - name: Release notes
        run: |
          awk -v tag="## ${GITHUB_REF_NAME}" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; fi
          printf '\nCheck the download: `VanguardSwitch.exe.sha256` has its SHA-256.\n' >> notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            out/VanguardSwitch.exe
            out/VanguardSwitch.exe.sha256
